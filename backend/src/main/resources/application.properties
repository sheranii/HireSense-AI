server.port=8080
server.servlet.context-path=/

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hiresense_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration (256-bit secret key encoded in Base64)
hiresense.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
hiresense.jwt.expiration-ms=86400000

# CORS Allowed Origins
hiresense.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Resume uploads are parsed in memory. Raw file bytes are never stored.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging
logging.level.root=INFO
logging.level.ai.hiresense=INFO
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n

